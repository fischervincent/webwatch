name: Check Tracked Items

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run checks
        run: bun run check
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

      - name: Commit updated state
        run: |
          git config user.name "webwatch-bot"
          git config user.email "webwatch-bot@users.noreply.github.com"
          git add data/items.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]" && git push
